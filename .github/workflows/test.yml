name: Tests

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv with all available options
        uses: astral-sh/setup-uv@v7
    
      - name: Sync dependencies
        run: |
          uv sync
    
      - name: Run tests
        run: |
          pytest tests/
