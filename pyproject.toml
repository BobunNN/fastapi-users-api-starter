[project]
authors = [
  {name = "Nhan Nguyen"},
]
dependencies = [
  "fastapi[standard]>=0.133.0",
]
description = "Fastapi app containerized quick start up"
name = "fastapi-docker-template"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.15.2",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501"]